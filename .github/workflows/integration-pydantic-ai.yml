name: integration-pydantic-ai

# The `pydantic-ai-governor` integration suite.
#
# It needs its own job because the root `testpaths = ["tests"]` scopes
# pytest discovery to the core suite: a green `test` run says nothing
# about this integration, and before this workflow existed the
# integration was verified locally only.
#
# Two distributions, one repository. This job installs core from the
# working tree and the integration on top of it, then runs only the
# integration's own tests. It never runs the core suite, and `test.yml`
# never runs these.
#
# Applicability guard. The integration publishes a deliberate, narrow
# dependency range on core. When the core version in this tree lies
# outside that range, installing the pair is not a valid test: pip would
# satisfy the integration's pin by pulling a published core over the
# editable one, and the suite would run in a mixed environment. So each
# leg first derives applicability from the two pyproject files
# (scripts/integration_applicability.py). Inside the range every install
# and test step runs exactly as before and failures fail CI; outside it
# the leg reports NOT APPLICABLE with both versions and the declared
# boundary and finishes without installing or testing. Malformed metadata
# fails the leg rather than skipping it. Nothing is hard-coded to a
# release: the integration's own next release, which widens its range
# after verifying the new core, makes the matrix applicable again.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: integration-pydantic-ai-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Matches the integration's own `requires-python = ">=3.10"`.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        # Both ends of the declared `pydantic-ai-slim>=2.37.0,<2.38`.
        # A bound nothing installs is a bound nothing tests: `floor` pins
        # the exact minimum, `ceiling` resolves the newest still inside
        # the range, so the range is exercised rather than described.
        pydantic-ai: [floor, ceiling]

    name: py${{ matrix.python-version }} · pydantic-ai ${{ matrix.pydantic-ai }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Determine applicability of this core to the integration's declared range
        id: applicability
        run: |
          python -m pip install --upgrade pip
          python -m pip install "packaging>=22" "tomli>=2.0; python_version < '3.11'"
          python scripts/integration_applicability.py

      - name: Not applicable to this declared package pair
        if: steps.applicability.outputs.applicable != 'true'
        run: |
          echo "::notice title=integration matrix not applicable::${{ steps.applicability.outputs.message }}"
          echo "${{ steps.applicability.outputs.message }}"
          echo "The integration's compatibility proof for a core outside its declared range is the"
          echo "local widened-pin validation recorded with the release; its own matrix runs again once"
          echo "it declares a range that admits this core."

      - name: Install core and the integration
        if: steps.applicability.outputs.applicable == 'true'
        run: |
          # Core first, from this tree rather than from PyPI: the
          # integration declares a dependency on published core, and
          # installing it here would test the released core instead of
          # the one this commit contains.
          python -m pip install -e .
          python -m pip install -e "./integrations/pydantic-ai-governor[dev]"

      - name: Pin pydantic-ai-slim to the floor of the declared range
        if: steps.applicability.outputs.applicable == 'true' && matrix.pydantic-ai == 'floor'
        run: python -m pip install "pydantic-ai-slim==2.37.0"

      - name: Resolve pydantic-ai-slim to the ceiling of the declared range
        if: steps.applicability.outputs.applicable == 'true' && matrix.pydantic-ai == 'ceiling'
        run: |
          python -m pip install --upgrade "pydantic-ai-slim>=2.37.0,<2.38"

      - name: Report the resolved environment
        if: steps.applicability.outputs.applicable == 'true'
        run: |
          python -c "import sys; print('python', sys.version)"
          python -m pip show pydantic-ai-slim sentience-governor \
            | grep -E "^(Name|Version):"

      # Explicit path, and only this path. Running from the repository
      # root would pick up the root config and discover the core suite.
      - name: Run the integration suite
        if: steps.applicability.outputs.applicable == 'true'
        run: python -m pytest integrations/pydantic-ai-governor/tests -v
